name: Build dd

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.9

      - name: Generate Gradle Wrapper
        run: |
          mkdir -p /tmp/wrap-gen
          cd /tmp/wrap-gen
          echo "" > settings.gradle
          echo "" > build.gradle
          gradle wrapper --gradle-version=8.9
          cp -r gradle/wrapper $GITHUB_WORKSPACE/gradle/
          cp gradlew gradlew.bat $GITHUB_WORKSPACE/
          chmod +x $GITHUB_WORKSPACE/gradlew

      - name: Build all APKs
        run: ./gradlew assembleDebug

      - name: Collect APKs
        run: |
          mkdir -p artifacts
          find app/build/outputs -name "*.apk" | while read f; do
            base=$(basename "$f")
            newname="dd-${base}"
            cp "$f" "artifacts/${newname}"
          done

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: dd-APKs
          path: artifacts/*.apk

  release:
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: dd-APKs
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          overwrite_files: true
          files: artifacts/*.apk
