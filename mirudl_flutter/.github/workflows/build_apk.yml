name: Build dd

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Collect APKs
        run: |
          mkdir -p artifacts
          for f in build/app/outputs/flutter-apk/*.apk; do
            base=$(basename "$f")
            newname="dd-${base}"
            cp "$f" "artifacts/${newname}"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dd-Android
          path: artifacts/*.apk

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Collect artifacts
        run: |
          mkdir artifacts
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath artifacts/dd-windows-x64.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dd-Windows
          path: artifacts/dd-windows-x64.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Install Linux deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libgtk-3-dev liblzma-dev ninja-build

      - name: Build Linux
        run: flutter build linux --release

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          tar -czf artifacts/dd-linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dd-Linux
          path: artifacts/dd-linux-x64.tar.gz

  release:
    needs: [build-android, build-windows, build-linux]
    runs-on: ubuntu-latest
    if: >
      always() &&
      (startsWith(github.ref, 'refs/tags/v') ||
       github.event_name == 'push' && github.ref == 'refs/heads/main' ||
       github.event_name == 'workflow_dispatch')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate release name
        id: name
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag_name=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
            echo "release_name=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          else
            echo "tag_name=build-$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT
            echo "release_name=Build $(date +%Y-%m-%d) $(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.name.outputs.tag_name }}
          name: ${{ steps.name.outputs.release_name }}
          body: "dd builds for Android + Windows + Linux"
          prerelease: ${{ steps.name.outputs.prerelease }}
          draft: false
          generate_release_notes: true
          overwrite_files: true
          files: artifacts/*
