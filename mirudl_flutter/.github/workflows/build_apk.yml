name: Build dd

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Setup release signing
        run: |
          cd android
          echo "storePassword=mirudl123" > key.properties
          echo "keyPassword=mirudl123" >> key.properties
          echo "keyAlias=upload" >> key.properties
          echo "storeFile=upload-keystore.jks" >> key.properties

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Collect APKs
        run: |
          mkdir -p artifacts
          for f in build/app/outputs/flutter-apk/*.apk; do
            base=$(basename "$f")
            newname="dd-${base}"
            cp "$f" "artifacts/${newname}"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dd-Android
          path: artifacts/*.apk

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Install Linux deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libgtk-3-dev liblzma-dev ninja-build

      - name: Generate Linux platform files
        run: flutter create --platforms=linux .

      - name: Build Linux
        run: flutter build linux --release

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          tar -czf artifacts/dd-linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dd-Linux
          path: artifacts/dd-linux-x64.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Windows platform files
        run: flutter create --platforms=windows .

      - name: Patch Flutter SDK for VS 2026
        shell: pwsh
        run: |
          # Flutter 3.19 only knows VS 2019 (v16) & VS 2022 (v17).
          # Runner has VS 2026 (v18) which falls to default -> VS 16 2019 (not installed).
          # Binary-patch the snapshot: replace "Visual Studio 16 2019" with "Visual Studio 17 2022"
          $snapshot = "$env:FLUTTER_ROOT\bin\cache\flutter_tools.snapshot"
          if (Test-Path $snapshot) {
            $bytes = [System.IO.File]::ReadAllBytes($snapshot)
            $oldStr = [System.Text.Encoding]::UTF8.GetBytes("Visual Studio 16 2019")
            $newStr = [System.Text.Encoding]::UTF8.GetBytes("Visual Studio 17 2022")
            $count = 0
            for ($i = 0; $i -le $bytes.Length - $oldStr.Length; $i++) {
              $match = $true
              for ($j = 0; $j -lt $oldStr.Length; $j++) {
                if ($bytes[$i + $j] -ne $oldStr[$j]) { $match = $false; break }
              }
              if ($match) {
                for ($j = 0; $j -lt $newStr.Length; $j++) {
                  $bytes[$i + $j] = $newStr[$j]
                }
                $count++
              }
            }
            Write-Host "Patched $count occurrence(s) in snapshot"
            [System.IO.File]::WriteAllBytes($snapshot, $bytes)
          } else {
            Write-Host "Snapshot not found!"
            exit 1
          }

      - name: Build Windows
        run: flutter build windows --release

      - name: Collect artifacts
        run: |
          mkdir artifacts -Force
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath artifacts/dd-windows-x64.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dd-Windows
          path: artifacts/dd-windows-x64.zip

  release:
    needs: [build-android, build-linux, build-windows]
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate release name
        id: name
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag_name=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
            echo "release_name=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          else
            echo "tag_name=build-$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT
            echo "release_name=Build $(date +%Y-%m-%d) $(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.name.outputs.tag_name }}
          name: ${{ steps.name.outputs.release_name }}
          body: "dd builds"
          prerelease: ${{ steps.name.outputs.prerelease }}
          draft: false
          generate_release_notes: true
          overwrite_files: true
          files: artifacts/*
