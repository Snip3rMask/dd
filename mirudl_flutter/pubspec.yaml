name: mirudl_flutter
description: dd - HLS Downloader
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1

  # Dependency Injection
  get_it: ^7.6.4

  # Networking
  dio: ^5.4.0

  # Local Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # File picking (SAF alternative)
  file_picker: ^6.1.1

  # Image loading
  cached_network_image: ^3.3.0

  # Notifications
  flutter_local_notifications: ^17.0.0

  # Background service
  flutter_background_service: ^5.0.1

  # Path utilities
  path_provider: ^2.1.1

  # Date formatting
  intl: ^0.19.0

  # Permissions
  permission_handler: ^11.1.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  mockito: ^5.4.4
  build_runner: ^2.4.8
  hive_generator: ^2.0.1
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
